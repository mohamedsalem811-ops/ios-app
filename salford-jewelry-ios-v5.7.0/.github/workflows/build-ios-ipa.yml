name: Build SALFORD Jewelry iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & sync Capacitor iOS
        run: |
          npm install
          npx cap sync ios

      - name: Build unsigned iOS App (for Sideloadly / AltStore)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../SALFORD-Jewelry-POS-v5.7.0.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SALFORD-Jewelry-POS-iOS-IPA
          path: SALFORD-Jewelry-POS-v5.7.0.ipa
